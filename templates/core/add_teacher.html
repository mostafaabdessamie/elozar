{% extends 'base.html' %}
{% block content %}

<style>
.card-fr{border:2.5px solid #000;border-radius:20px;background:#fff;box-shadow:7px 7px 0 #000}
.input-fr{border:2px solid #000 !important;border-radius:12px !important;padding:12px !important}
.input-fr:focus{box-shadow:4px 4px 0 #000 !important;border-color:#000 !important}
.btn-yellow{background:#FFC107;color:#000;font-weight:800;border:2.5px solid #000;border-radius:12px;padding:12px;box-shadow:3px 3px 0 #000}
.btn-yellow:hover{background:#000;color:#FFC107;transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
.btn-cancel{border:2.5px solid #000;border-radius:12px;padding:12px;font-weight:700;background:#fff}
.btn-cancel:hover{background:#000;color:#fff}
label{font-weight:800 !important;margin-bottom:6px;text-transform:uppercase;font-size:0.85rem}
</style>

<div class="container mt-4" style="max-width:650px">
  <a href="{% url 'teacher_list' %}" class="btn btn-cancel btn-sm mb-3">← Liste des professeurs</a>

  <div class="card card-fr p-4 p-md-5">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="bg-dark text-warning rounded-3 d-flex align-items-center justify-content-center fw-bold border border-2 border-dark" style="width:60px;height:60px;font-size:28px">👨‍🏫</div>
      <div>
        <h3 class="fw-bold mb-0">Ajouter un professeur</h3>
        <small class="text-muted fw-bold">ELOZAR • Nouveau professeur</small>
      </div>
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="row g-3">
      {% for field in form %}
        <div class="{% if field.name in 'profile_picture bio' %}col-12{% else %}col-md-6{% endif %}">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="bg-danger text-white rounded-2 p-2 mt-2 small fw-bold" style="border:2px solid #000">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}
      </div>

      <div class="row g-2 mt-4">
        <div class="col-6">
          <a href="{% url 'teacher_list' %}" class="btn btn-cancel w-100">Annuler</a>
        </div>
        <div class="col-6">
          <button type="submit" class="btn btn-yellow w-100">✨ Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<br>
<script>
document.querySelectorAll('input, textarea, select').forEach(el => {
  if(el.type !== 'checkbox' && el.type !== 'radio'){
    el.classList.add('form-control','input-fr');
  }
});
</script>

{% endblock %}
