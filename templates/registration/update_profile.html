{% extends 'base.html' %}

{% block title %}Modifier mon profil{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4 text-primary">Modifier mon profil</h1>
    
    <!-- Formulaire de modification de profil -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- عناصر النموذج مع Bootstrap -->
        <div class="form-group mb-3">
            {{ form.as_p }}
        </div>
        
        <!-- زر التحديث -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">Mettre à jour</button>
        </div>
    </form>

    <!-- رابط العودة إلى الملف الشخصي -->
    <div class="text-center mt-3">
        <a href="{% url 'profile' %}" class="btn btn-link">Retour à mon profil</a>
    </div>
</div>
{% endblock %}
