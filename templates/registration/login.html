{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="container-fluid">

        <!-- Right side login form -->
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card shadow-lg">
                            <div class="card-header text-center bg-primary text-white">
                                <h3>Se connecter</h3>
                            </div>
                            <div class="card-body">
                                <form method="post">
                                    {% csrf_token %}
                                    
                                    <!-- Username input -->
                                    <div class="form-group mb-3">
                                        <label for="username" class="fw-bold">Nom d'utilisateur</label>
                                        <input id="username" type="text" name="username" class="form-control" required>
                                    </div>

                                    <!-- Password input -->
                                    <div class="form-group mb-3">
                                        <label for="password" class="fw-bold">Mot de passe</label>
                                        <input id="password" type="password" name="password" class="form-control" required>
                                    </div>

                                    <!-- Remember me checkbox -->
                                    <div class="form-group form-check mb-3">
                                        <input type="checkbox" name="remember" id="remember" class="form-check-input">
                                        <label class="form-check-label" for="remember">Se souvenir de moi</label>
                                    </div>

                                    <!-- Submit button -->
                                    <button type="submit" class="btn btn-primary btn-block w-100">Se connecter</button>

                                    <!-- Forgot password link -->
                                    <div class="mt-3 text-center">
                                        <a href="{% url 'password_reset' %}" class="btn btn-link">Avez-vous oublié votre mot de passe ?</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
