{% extends 'base.html' %}


{% block title %}Math_Edu: Modifier le Cours{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-body">
            <h1 class="text-center text-primary mb-4">✏ Modifier le cours</h1>

            <form method="POST">
                {% csrf_token %}

                <!-- Titre -->
                <div class="mb-3">
                    <label class="form-label fw-bold">📌 Titre :</label>
                    <input type="text" name="title" class="form-control" value="{{ course.title }}" required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label fw-bold">📄 Description :</label>
                    <textarea name="description" class="form-control" rows="5" required>{{ course.description }}</textarea>
                </div>

                <!-- Boutons d'action -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">💾 Mettre à jour</button>
                    <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">↩ Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
