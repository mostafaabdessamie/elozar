{% extends 'base.html' %}

{% block title %}Math_Edu: Ajauter Cours {% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Titre du formulaire -->
    <h1 class="text-center text-primary mb-4">📝 Créer un nouveau cours</h1>

    <!-- Formulaire de création de cours -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Titre du cours -->
        <div class="mb-3">
            <label for="title" class="form-label fw-bold">📌 Titre du cours :</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>

        <!-- Description du cours -->
        <div class="mb-3">
            <label for="description" class="form-label fw-bold">📄 Description :</label>
            <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
        </div>
        <!-- Image -->
        <div class="mb-3">
            <label for="image" class="form-label fw-bold">📸 Image :</label>
            <input type="file" id="image" name="image" class="form-control">
        </div>

        <!-- Bouton de soumission -->
        <div class="text-center">
            <button type="submit" class="btn btn-success btn-lg"> ➕  Créer un Cours </button>
        </div>
    </form>
</div>
{% endblock %}
