{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center">
                <div class="card-body p-5">
                    <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex p-4 mb-4">
                        <i class="bi bi-trash3 text-danger" style="font-size: 2.5rem;"></i>
                    </div>

                    <h4 class="fw-bold mb-2">Supprimer le livre ?</h4>
                    <p class="text-muted mb-4">Cette action est irréversible.</p>

                    <div class="bg-light rounded-3 p-3 d-flex align-items-center gap-3 text-start mb-4">
                        <img src="{{ livre.image.url }}" style="width:60px; height:80px; object-fit:cover; border-radius:8px;">
                        <div>
                            <h6 class="fw-bold mb-1">{{ livre.titre }}</h6>
                            <small class="text-muted"><i class="bi bi-file-earmark-pdf me-1"></i> {{ livre.pdf.name|truncatechars:25 }}</small>
                        </div>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg rounded-3 fw-bold py-3">
                                <i class="bi bi-trash me-2"></i> Oui, supprimer
                            </button>
                            <a href="{% url 'livre_list' %}" class="btn btn-light rounded-3 py-3">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
