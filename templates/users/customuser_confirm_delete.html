{% extends 'base.html' %}

{% block title %}Supprimer l'utilisateur{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Supprimer l'utilisateur</h1>
<p>Êtes-vous sûr de vouloir supprimer l'utilisateur "{{ user.username }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'customuser_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
