{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} un message{% endblock %}

{% block content %}
<h1 class="text-center mb-4">{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} un message</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'message_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
