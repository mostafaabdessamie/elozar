{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h1>Supprimer l'utilisateur</h1>
    <p>Êtes-vous sûr de vouloir supprimer {{ object.username }} ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Supprimer</button>
        <a href="{% url 'customuser_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
