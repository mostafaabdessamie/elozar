{% extends 'base.html' %}

{% block title %}Détails de l'utilisateur{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Détails de l'utilisateur</h1>
<div class="card">
    <div class="card-body">
        <h5 class="card-title">{{ user.username }}</h5>
        <p class="card-text">E-mail : {{ user.email }}</p>
        <p class="card-text">Type : {{ user.get_user_type_display }}</p>
        <p class="card-text">Niveau : {{ user.niveau }}</p>
        <p class="card-text">Bio : {{ user.bio }}</p>
        <a href="{% url 'customuser_list' %}" class="btn btn-secondary">Retour</a>
    </div>
</div>
{% endblock %}
