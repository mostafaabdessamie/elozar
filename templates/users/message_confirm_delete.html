{% extends 'base.html' %}

{% block title %}Supprimer le message{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Supprimer le message</h1>
<p>Êtes-vous sûr de vouloir supprimer ce message ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'message_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
