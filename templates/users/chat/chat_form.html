{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Créer une nouvelle discussion</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }} 
        </div>
        <button type="submit" class="btn btn-primary">Créer</button>
    </form>
    <a href="{% url 'chat_list' %}" class="btn btn-secondary mt-3">Retour à la liste</a>
</div>
{% endblock %}
